# roadmap.yml -- Per-Phase Execution State (Dependency-Aware Template)
#
# This file is the canonical machine-readable execution state for this phase.
# Keep it machine-readable and deterministic.

phase: <PHASE_NUMBER>
name: <PHASE_TITLE>

status:
  active: true
  blocked: false
  started_at: null
  completed_at: null

# Explicit upstream phase dependencies by folder name.
# Example: [upstream-roadmap-phase]
depends_on_phases: <PHASE_DEPENDENCIES>

# Replace the placeholder with the concrete tasks of this phase. Each task delivers part of the
# feature; tests and verification belong inside the task they cover, not in a task of their own.
tasks:
  - id: <TASK_PREFIX>-1
    title: Deliver <PHASE_TITLE>
    description: >
      Implement what ROADMAP.md names as this phase's goal, test the parts that can
      really break, and confirm the "Done when" criterion by running it.
    status: active
    effort: medium
    key_files:
      - src/
    depends_on: []

focus:
  current_task: <TASK_PREFIX>-1
  notes: >
    Update this note at the end of each session with concise status and next action.
